<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨蝶御用厨房 - 四川家庭菜谱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #E63946;
    --orange: #F4A261;
    --brown: #8B4513;
    --cream: #FFF8F0;
    --dark: #2C1810;
    --gray: #6B6B6B;
    --light-gray: #F5F5F5;
    --white: #FFFFFF;
    --shadow: 0 4px 20px rgba(0,0,0,0.1);
    --radius: 16px;
  }
  html, body { height: 100%; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; background: var(--cream); color: var(--dark); overflow-x: hidden; }

  /* 顶部标题栏 */
  .header {
    background: linear-gradient(135deg, #E63946 0%, #C1121F 100%);
    padding: 20px 16px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(230,57,70,0.4);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { color: #fff; font-size: 18px; font-weight: 600; }
  .logo-sub { color: rgba(255,255,255,0.8); font-size: 12px; }
  .random-btn {
    background: rgba(255,255,255,0.2);
    border: 1.5px solid rgba(255,255,255,0.6);
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all 0.2s;
  }
  .random-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
  .search-bar {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    padding: 8px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .search-bar input {
    background: transparent; border: none; outline: none;
    color: #fff; font-size: 14px; flex: 1;
    placeholder-color: rgba(255,255,255,0.6);
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
  .search-icon { font-size: 16px; }

  /* 分类标签 */
  .category-section { padding: 16px 16px 8px; }
  .section-title { font-size: 16px; font-weight: 600; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .category-scroll::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    background: var(--white);
    border: 1.5px solid #E8E8E8;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 4px;
  }
  .cat-chip.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 3px 10px rgba(230,57,70,0.3);
  }
  .cat-chip:active { transform: scale(0.95); }

  /* 今日推荐横幅 */
  .daily-banner {
    margin: 12px 16px;
    background: linear-gradient(135deg, #8B4513 0%, #C75B30 100%);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    overflow: hidden;
    position: relative;
  }
  .daily-banner:active { transform: scale(0.98); }
  .daily-banner::before {
    content: '';
    position: absolute; top: -20px; right: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .banner-text { color: #fff; flex: 1; }
  .banner-label { font-size: 11px; background: rgba(255,255,255,0.2); display: inline-block; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
  .banner-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .banner-desc { font-size: 12px; opacity: 0.85; }
  .banner-img {
    width: 80px; height: 80px; border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }

  /* 菜品网格 */
  .recipes-section { padding: 0 16px 100px; }
  .recipes-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .recipe-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeInUp 0.4s ease both;
  }
  .recipe-card:active { transform: scale(0.97); }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-img {
    width: 100%; height: 140px;
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
    position: relative;
    overflow: hidden;
  }
  .card-img .card-emoji { font-size: 56px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .spicy-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(230,57,70,0.9);
    color: #fff; font-size: 10px;
    padding: 2px 7px; border-radius: 10px;
  }
  .fav-btn {
    position: absolute; top: 8px; left: 8px;
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    border: none; cursor: pointer;
    transition: transform 0.2s;
  }
  .fav-btn:active { transform: scale(1.3); }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card-meta { display: flex; align-items: center; gap: 8px; }
  .card-time { font-size: 11px; color: var(--gray); display: flex; align-items: center; gap: 3px; }
  .card-diff { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
  .diff-easy { background: #E8F5E9; color: #388E3C; }
  .diff-med { background: #FFF3E0; color: #F57C00; }
  .diff-hard { background: #FFEBEE; color: #D32F2F; }
  .card-tag { font-size: 11px; color: var(--gray); }

  /* 底部 tab */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-top: 1px solid #EEEEEE;
    display: flex;
    padding: 8px 0 env(safe-area-inset-bottom, 8px);
    z-index: 200;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer;
    padding: 4px 0;
    transition: all 0.2s;
  }
  .tab-icon { font-size: 22px; line-height: 1; }
  .tab-label { font-size: 10px; color: #999; }
  .tab-item.active .tab-label { color: var(--red); }

  /* 详情页遮罩 */
  .detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 300;
    display: none;
    animation: fadeIn 0.3s;
  }
  .detail-overlay.open { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .detail-sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-img {
    width: 100%; height: 220px;
    display: flex; align-items: center; justify-content: center;
    font-size: 90px;
    border-radius: 24px 24px 0 0;
    overflow: hidden;
    position: relative;
  }
  .detail-img .detail-emoji { font-size: 90px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2)); }
  .detail-img img { width: 100%; height: 100%; object-fit: cover; }
  .detail-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: rgba(0,0,0,0.3);
    border: none; border-radius: 50%;
    color: #fff; font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-content { padding: 20px 16px 40px; }
  .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .detail-badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .d-badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
  .d-badge-red { background: #FFEBEE; color: #D32F2F; }
  .d-badge-org { background: #FFF3E0; color: #F57C00; }
  .d-badge-grn { background: #E8F5E9; color: #388E3C; }
  .d-badge-blue { background: #E3F2FD; color: #1565C0; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; padding-left: 8px; border-left: 3px solid var(--red); }
  .ingredients-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ingredient-item {
    background: var(--light-gray);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
  }
  .ing-name { font-size: 13px; font-weight: 500; }
  .ing-amount { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .steps-list { list-style: none; }
  .step-item { display: flex; gap: 12px; margin-bottom: 14px; }
  .step-num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    background: var(--red);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    margin-top: 1px;
  }
  .step-text { font-size: 14px; line-height: 1.6; color: #333; }
  .tips-box {
    background: #FFF8E1;
    border-left: 3px solid #FFB300;
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    font-size: 13px; color: #5D4037; line-height: 1.6;
  }

  /* 随机推荐弹窗 */
  .random-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 400;
    display: none;
    align-items: center; justify-content: center;
  }
  .random-overlay.open { display: flex; }
  .random-card {
    background: var(--white);
    border-radius: 24px;
    width: calc(100% - 48px);
    max-width: 360px;
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .random-img {
    width: 100%; height: 200px;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
    overflow: hidden;
  }
  .random-img .random-emoji { font-size: 80px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2)); }
  .random-img img { width: 100%; height: 100%; object-fit: cover; }
  .random-body { padding: 20px; }
  .random-label { font-size: 12px; color: var(--gray); margin-bottom: 6px; }
  .random-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .random-desc { font-size: 14px; color: var(--gray); margin-bottom: 16px; line-height: 1.6; }
  .random-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1; background: var(--red); color: #fff;
    border: none; border-radius: 22px; padding: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:active { transform: scale(0.96); }
  .btn-secondary {
    flex: 1; background: var(--light-gray); color: var(--dark);
    border: none; border-radius: 22px; padding: 12px;
    font-size: 15px; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:active { transform: scale(0.96); }

  /* 收藏页 */
  .page { display: none; }
  .page.active { display: block; }
  .fav-empty { text-align: center; padding: 60px 20px; color: var(--gray); }
  .fav-empty .empty-icon { font-size: 60px; margin-bottom: 16px; }
  .fav-empty p { font-size: 15px; }

  /* 加载动画 */
  .loading-dots { display: flex; gap: 6px; justify-content: center; padding: 40px; }
  .dot { width: 10px; height: 10px; background: var(--red); border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }

  /* ============ 购物车样式 ============ */
  .cart-badge {
    position: absolute; top: -2px; right: -6px;
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 700;
    min-width: 16px; height: 16px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  .cart-badge:empty { display: none; }
  .add-cart-btn {
    background: linear-gradient(135deg, #FF6B35, #E63946);
    color: #fff; border: none; border-radius: 14px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 3px;
    transition: all 0.2s; white-space: nowrap;
  }
  .add-cart-btn:active { transform: scale(0.92); }
  .add-cart-btn.added {
    background: linear-gradient(135deg, #4CAF50, #388E3C);
  }

  /* 购物车页面 */
  .cart-header-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
  }
  .clear-cart-btn {
    background: none; border: 1.5px solid #E0E0E0;
    color: var(--gray); border-radius: 14px;
    padding: 5px 12px; font-size: 12px; cursor: pointer;
    transition: all 0.2s;
  }
  .clear-cart-btn:active { background: #FFF0F0; border-color: var(--red); color: var(--red); }

  .cart-item {
    background: var(--white);
    border-radius: var(--radius);
    padding: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    animation: fadeInUp 0.3s ease both;
  }
  .cart-item-img {
    width: 70px; height: 70px; border-radius: 12px;
    object-fit: cover; flex-shrink: 0;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .cart-item-price { font-size: 13px; color: var(--red); font-weight: 600; }
  .cart-item-cat { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .qty-control {
    display: flex; align-items: center; gap: 0;
    background: var(--light-gray); border-radius: 20px;
    overflow: hidden; flex-shrink: 0;
  }
  .qty-btn {
    width: 28px; height: 28px; border: none; background: transparent;
    font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.15s; color: var(--dark);
  }
  .qty-btn:active { background: #DDD; }
  .qty-num {
    width: 30px; text-align: center; font-size: 14px;
    font-weight: 600; line-height: 28px;
  }
  .remove-cart-item {
    background: none; border: none; color: #CCC;
    font-size: 18px; cursor: pointer; padding: 4px;
    flex-shrink: 0; transition: color 0.2s;
  }
  .remove-cart-item:active { color: var(--red); }

  /* 购物车底部结算栏 */
  .cart-footer-bar {
    position: fixed; bottom: 60px; left: 0; right: 0;
    background: var(--white); border-top: 1px solid #EEE;
    padding: 10px 16px; z-index: 190;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .cart-total-info { display: flex; align-items: baseline; gap: 4px; }
  .cart-total-label { font-size: 13px; color: var(--gray); }
  .cart-total-price { font-size: 22px; font-weight: 700; color: var(--red); }
  .cart-total-count { font-size: 12px; color: var(--gray); }
  .checkout-btn {
    background: linear-gradient(135deg, var(--red), #C1121F);
    color: #fff; border: none; border-radius: 22px;
    padding: 10px 24px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .checkout-btn:active { transform: scale(0.96); }

  /* 购物车空状态 */
  .cart-empty { text-align: center; padding: 80px 20px; color: var(--gray); }
  .cart-empty .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .cart-empty p { font-size: 15px; margin-bottom: 16px; }
  .cart-empty .go-shop-btn {
    background: var(--red); color: #fff; border: none;
    border-radius: 22px; padding: 10px 28px; font-size: 14px; cursor: pointer;
  }

  /* 详情页加入购物车按钮 */
  .detail-add-cart {
    position: sticky; bottom: 0;
    background: linear-gradient(135deg, #FF6B35, #E63946);
    color: #fff; border: none; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 600;
    cursor: pointer; width: 100%; margin-top: 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s;
  }
  .detail-add-cart:active { transform: scale(0.98); }
  .detail-add-cart.added {
    background: linear-gradient(135deg, #4CAF50, #388E3C);
  }

  /* 卡片上的价格标签 */
  .card-price-tag {
    font-size: 13px; color: var(--red); font-weight: 700;
    margin-top: 3px;
  }
</style>
</head>
<body>

<!-- 主页 -->
<div id="page-home" class="page active">
  <!-- 顶部 -->
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">🍜</div>
        <div>
          <div class="logo-text">雨蝶御用厨房</div>
          <div class="logo-sub">四川家庭菜谱</div>
        </div>
      </div>
      <button class="random-btn" onclick="showRandom()">
        🎲 今天吃啥
      </button>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="搜索菜名、食材..." id="search-input" oninput="searchRecipes(this.value)">
    </div>
  </div>

  <!-- 分类 -->
  <div class="category-section">
    <div class="category-scroll" id="cat-scroll">
      <div class="cat-chip active" data-cat="all" onclick="filterCat('all', this)">🍽️ 全部</div>
      <div class="cat-chip" data-cat="荤菜" onclick="filterCat('荤菜', this)">🥩 荤菜</div>
      <div class="cat-chip" data-cat="素菜" onclick="filterCat('素菜', this)">🥦 素菜</div>
      <div class="cat-chip" data-cat="汤类" onclick="filterCat('汤类', this)">🍲 汤类</div>
      <div class="cat-chip" data-cat="小吃" onclick="filterCat('小吃', this)">🍢 小吃</div>
      <div class="cat-chip" data-cat="火锅" onclick="filterCat('火锅', this)">🫕 火锅</div>
      <div class="cat-chip" data-cat="凉菜" onclick="filterCat('凉菜', this)">🥗 凉菜</div>
    </div>
  </div>

  <!-- 今日推荐 -->
  <div class="daily-banner" id="daily-banner" onclick="openDetailById(dailyPick)">
    <div class="banner-text">
      <div class="banner-label">🌶️ 今日推荐</div>
      <div class="banner-title" id="daily-name">宫保鸡丁</div>
      <div class="banner-desc" id="daily-desc">经典川菜，香辣可口</div>
    </div>
    <div class="banner-img" id="daily-img">🍗</div>
  </div>

  <!-- 菜品列表 -->
  <div class="recipes-section">
    <div class="section-title">🔥 精选菜谱</div>
    <div class="recipes-grid" id="recipes-grid"></div>
  </div>
</div>

<!-- 收藏页 -->
<div id="page-fav" class="page">
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">❤️</div>
        <div>
          <div class="logo-text">我的收藏</div>
          <div class="logo-sub">喜欢的菜都在这里</div>
        </div>
      </div>
    </div>
  </div>
  <div style="padding: 16px 16px 100px;">
    <div class="section-title">❤️ 已收藏</div>
    <div class="recipes-grid" id="fav-grid"></div>
    <div class="fav-empty" id="fav-empty" style="display:none">
      <div class="empty-icon">🍽️</div>
      <p>还没有收藏菜谱哦<br>快去发现好吃的川菜吧！</p>
    </div>
  </div>

let favorites = JSON.parse(localStorage.getItem('sichuan_favs') || '[]');
let currentFilter = 'all';
let currentSearch = '';
let currentDetailId = null;
let randomPickId = null;
let dailyPick = 1;

// 初始化
window.onload = function() {
  setDailyPick();
  renderRecipes(getFilteredRecipes());
};

function setDailyPick() {
  const idx = Math.floor(Math.random() * recipes.length);
  const pick = recipes[idx];
  dailyPick = pick.id;
  document.getElementById('daily-name').textContent = pick.name;
  document.getElementById('daily-desc').textContent = pick.desc.substring(0, 18) + '...';
  const imgEl = document.getElementById('daily-img');
  imgEl.textContent = pick.emoji;
}

function getFilteredRecipes() {
  return recipes.filter(r => {
    const matchCat = currentFilter === 'all' || r.cat === currentFilter;
    const matchSearch = !currentSearch || r.name.includes(currentSearch) || r.tag.includes(currentSearch);
    return matchCat && matchSearch;
  });
}

function renderRecipes(list) {
  const grid = document.getElementById('recipes-grid');
  if (list.length === 0) {
    grid.innerHTML = '<p style="color:#999;text-align:center;padding:40px;grid-column:span 2">没有找到相关菜谱 😢</p>';
    return;
  }
  grid.innerHTML = list.map((r, i) => {
    const isFav = favorites.includes(r.id);
    const inCart = cart.some(c => c.id === r.id);
    return `
    <div class="recipe-card" style="animation-delay:${i*0.06}s" onclick="openDetail(${r.id})">
      <div class="card-img" style="background: linear-gradient(135deg, ${getCardGradient(r.cat)}, ${getCardGradient2(r.cat)})">
        <img src="${r.img}" alt="${r.name}" onerror="this.style.display='none'">
        ${r.spicy ? `<div class="spicy-badge">${r.spicy}</div>` : ''}
        <button class="fav-btn" onclick="toggleFav(event,${r.id})">${isFav ? '❤️' : '🤍'}</button>
      </div>
      <div class="card-body">
        <div class="card-name">${r.name}</div>
        <div class="card-meta">
          <span class="card-time">⏱️ ${r.time}</span>
          <span class="card-diff ${getDiffClass(r.diff)}">${getDiffLabel(r.diff)}</span>
        </div>
        <div class="card-tag" style="margin-top:4px;font-size:11px;color:#999">${r.tag}</div>
        <div class="card-price-tag">¥0</div>
        <div style="margin-top:6px">
          <button class="add-cart-btn ${inCart ? 'added' : ''}" onclick="event.stopPropagation();toggleCart(${r.id})">
            ${inCart ? '✅ 已加入购物车' : '🛒 加入购物车'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function getDiffClass(d) {
  return d === 'easy' ? 'diff-easy' : d === 'med' ? 'diff-med' : 'diff-hard';
}
function getDiffLabel(d) {
  return d === 'easy' ? '简单' : d === 'med' ? '适中' : '有难度';
}

// 分类渐变配色
const catColors = {
  '荤菜': { from: '#FFE5E5', to: '#FFCCCC' },
  '素菜': { from: '#E8F5E9', to: '#C8E6C9' },
  '汤类': { from: '#E3F2FD', to: '#BBDEFB' },
  '小吃': { from: '#FFF3E0', to: '#FFE0B2' },
  '火锅': { from: '#FCE4EC', to: '#F8BBD0' },
  '凉菜': { from: '#E0F7FA', to: '#B2EBF2' },
};
function getCardGradient(cat) { return (catColors[cat] || catColors['荤菜']).from; }
function getCardGradient2(cat) { return (catColors[cat] || catColors['荤菜']).to; }

function filterCat(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderRecipes(getFilteredRecipes());
}

function searchRecipes(val) {
  currentSearch = val.trim();
  renderRecipes(getFilteredRecipes());
}

function toggleFav(e, id) {
  e.stopPropagation();
  const btn = e.currentTarget;
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
    btn.textContent = '🤍';
  } else {
    favorites.push(id);
    btn.textContent = '❤️';
    btn.style.transform = 'scale(1.4)';
    setTimeout(() => btn.style.transform = '', 300);
  }
  localStorage.setItem('sichuan_favs', JSON.stringify(favorites));
}

function openDetailById(id) {
  openDetail(id);
}

function openDetail(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  currentDetailId = id;

  const imgWrap = document.getElementById('detail-img-wrap');
  imgWrap.innerHTML = `<img src="${r.img}" alt="${r.name}" style="width:100%;height:240px;object-fit:cover;border-radius:24px 24px 0 0">`;
  
  document.getElementById('detail-title').textContent = r.name;
  
  const badges = document.getElementById('detail-badges');
  badges.innerHTML = `
    <span class="d-badge d-badge-red">🌶️ ${r.spicy || '不辣'}</span>
    <span class="d-badge d-badge-org">⏱️ ${r.time}</span>
    <span class="d-badge d-badge-grn">${getDiffLabel(r.diff)}</span>
    <span class="d-badge d-badge-blue">${r.cat}</span>
  `;
  
  document.getElementById('detail-ingredients').innerHTML = r.ingredients.map(ing => `
    <div class="ingredient-item">
      <div class="ing-name">${ing.name}</div>
      <div class="ing-amount">${ing.amt}</div>
    </div>
  `).join('');
  
  document.getElementById('detail-steps').innerHTML = r.steps.map((s, i) => `
    <li class="step-item">
      <div class="step-num">${i+1}</div>
      <div class="step-text">${s}</div>
    </li>
  `).join('');
  
  document.getElementById('detail-tips').textContent = r.tips;

  // 更新详情页购物车按钮状态
  const cartBtn = document.getElementById('detail-cart-btn');
  const inCartDetail = cart.some(c => c.id === id);
  if (inCartDetail) {
    cartBtn.innerHTML = '✅ 已加入购物车 🎉';
    cartBtn.classList.add('added');
  } else {
    cartBtn.innerHTML = '🛒 加入购物车（免费）';
    cartBtn.classList.remove('added');
  }

  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetailBtn();
}
function closeDetailBtn() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function showRandom() {
  const idx = Math.floor(Math.random() * recipes.length);
  const r = recipes[idx];
  randomPickId = r.id;
  
  const imgWrap = document.getElementById('random-img-wrap');
  imgWrap.innerHTML = `<img src="${r.img}" alt="${r.name}" style="width:100%;height:200px;object-fit:cover;border-radius:16px">`;
  
  document.getElementById('random-title').textContent = r.name;
  document.getElementById('random-desc').textContent = r.desc;
  document.getElementById('random-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRandom(e) {
  if (e.target === document.getElementById('random-overlay')) {
    document.getElementById('random-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function openRandomDetail() {
  document.getElementById('random-overlay').classList.remove('open');
  document.body.style.overflow = '';
  if (randomPickId) openDetail(randomPickId);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');

  if (tab === 'fav') {
    const favRecipes = recipes.filter(r => favorites.includes(r.id));
    if (favRecipes.length === 0) {
      document.getElementById('fav-grid').innerHTML = '';
      document.getElementById('fav-empty').style.display = 'block';
    } else {
      document.getElementById('fav-empty').style.display = 'none';
      document.getElementById('fav-grid').innerHTML = favRecipes.map((r,i) => {
        return `
        <div class="recipe-card" style="animation-delay:${i*0.06}s" onclick="openDetail(${r.id})">
          <div class="card-img">
            <img src="${r.img}" alt="${r.name}" onerror="this.style.display='none'">
            ${r.spicy ? `<div class="spicy-badge">${r.spicy}</div>` : ''}
            <button class="fav-btn" onclick="toggleFav(event,${r.id})">❤️</button>
          </div>
          <div class="card-body">
            <div class="card-name">${r.name}</div>
            <div class="card-meta">
              <span class="card-time">⏱️ ${r.time}</span>
              <span class="card-diff ${getDiffClass(r.diff)}">${getDiffLabel(r.diff)}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }
  }

  if (tab === 'cart') {
    renderCart();
  }
}

// ============== 购物车功能 ==============

let cart = JSON.parse(localStorage.getItem('sichuan_cart') || '[]');

function saveCart() {
  localStorage.setItem('sichuan_cart', JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-badge');
  badge.textContent = totalQty > 0 ? totalQty > 99 ? '99+' : totalQty : '';
}

function toggleCart(id) {
  const idx = cart.findIndex(c => c.id === id);
  if (idx >= 0) {
    cart.splice(idx, 1);
  } else {
    cart.push({ id: id, qty: 1 });
  }
  saveCart();
  renderRecipes(getFilteredRecipes());
  // 如果在购物车页面则刷新
  if (document.getElementById('page-cart').classList.contains('active')) {
    renderCart();
  }
}

function toggleCartFromDetail() {
  if (!currentDetailId) return;
  const r = recipes.find(x => x.id === currentDetailId);
  if (!r) return;

  const idx = cart.findIndex(c => c.id === currentDetailId);
  const btn = document.getElementById('detail-cart-btn');

  if (idx >= 0) {
    cart.splice(idx, 1);
    btn.innerHTML = '🛒 加入购物车（免费）';
    btn.classList.remove('added');
  } else {
    cart.push({ id: currentDetailId, qty: 1 });
    btn.innerHTML = '✅ 已加入购物车 🎉';
    btn.classList.add('added');
    // 动画效果
    btn.style.transform = 'scale(1.05)';
    setTimeout(() => btn.style.transform = '', 200);
  }
  saveCart();
  renderRecipes(getFilteredRecipes());
}

function changeCartQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(c => c.id !== id);
  }
  saveCart();
  renderCart();
}

function removeCartItem(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCart();
  // 同步刷新首页卡片按钮状态
  renderRecipes(getFilteredRecipes());
}

function clearCart() {
  if (cart.length === 0) return;
  if (!confirm('确定要清空购物车吗？')) return;
  cart = [];
  saveCart();
  renderCart();
  renderRecipes(getFilteredRecipes());
}

function renderCart() {
  const listEl = document.getElementById('cart-list');
  const emptyEl = document.getElementById('cart-empty');
  const footerEl = document.getElementById('cart-footer');
  const totalItemsEl = document.getElementById('cart-total-items');
  const countLabelEl = document.getElementById('cart-count-label');

  if (cart.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    footerEl.style.display = 'none';
    totalItemsEl.textContent = '0';
    return;
  }

  emptyEl.style.display = 'none';
  footerEl.style.display = 'flex';

  let totalQty = 0;
  listEl.innerHTML = cart.map((item, i) => {
    const r = recipes.find(x => x.id === item.id);
    if (!r) return '';
    totalQty += item.qty;
    return `
    <div class="cart-item" style="animation-delay:${i*0.06}s">
      <img class="cart-item-img" src="${r.img}" alt="${r.name}" onerror="this.style.display='none'">
      <div class="cart-item-info">
        <div class="cart-item-name">${r.name}</div>
        <div class="cart-item-price">¥0</div>
        <div class="cart-item-cat">${r.cat} · ${r.time}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeCartQty(${r.id}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeCartQty(${r.id}, 1)">+</button>
      </div>
      <button class="remove-cart-item" onclick="removeCartItem(${r.id})">✕</button>
    </div>`;
  }).join('');

  totalItemsEl.textContent = totalQty;
  countLabelEl.textContent = `共 ${totalQty} 道菜`;
}

function doCheckout() {
  if (cart.length === 0) return;
  // 汇总已选菜品名称
  const dishNames = cart.map(item => {
    const r = recipes.find(x => x.id === item.id);
    return r ? `${r.name}${item.qty > 1 ? '×' + item.qty : ''}` : '';
  }).filter(Boolean).join('、');

  const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);

  alert(`🎉 下单成功！\n\n您选择了 ${totalCount} 道川菜：\n${dishNames}\n\n💰 合计：¥0（免费家厨）\n\n祝用餐愉快！❤️`);

  // 清空购物车
  cart = [];
  saveCart();
  renderCart();
  renderRecipes(getFilteredRecipes());
}

// 初始化购物车角标
updateCartBadge();
</script>
